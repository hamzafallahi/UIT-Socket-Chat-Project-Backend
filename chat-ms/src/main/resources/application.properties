spring.application.name=chat-ms
server.port=8082

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true

# PostgreSQL
spring.datasource.url=${CHAT_DB_URL:jdbc:postgresql://localhost:5437/uit_chat_db}
spring.datasource.username=${CHAT_DB_USER:uit_chat}
spring.datasource.password=${CHAT_DB_PASSWORD:uit_chat_pass}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JWT Secret (shared with other microservices)
jwt.secret=K7gNU3sdo+OL0wNhqoVWhr3g6s1xYv72ol/pe/Unols=

# Jitsi Meet Configuration (self-hosted via Docker — no login required)
jitsi.server.url=http://localhost:8880
jitsi.app.id=uit_project
jitsi.app.secret=unused
jitsi.jwt.enabled=false
